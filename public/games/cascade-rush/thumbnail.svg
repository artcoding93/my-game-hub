<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0626"/>
      <stop offset="1" stop-color="#2b0f4f"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a33"/>
      <stop offset="1" stop-color="#22104a"/>
    </linearGradient>
    <radialGradient id="burst">
      <stop offset="0" stop-color="#fff3bd" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffc533" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc533" stop-opacity="0"/>
    </radialGradient>
    <!-- 크리스털 다섯 종 (게임 안 그림과 같은 모양) -->
    <g id="ruby"><path d="M0-13 L11.5 0 L0 13 L-11.5 0Z" fill="#ff3d64" stroke="#8f0f33" stroke-width="2"/><path d="M0-6 L5.5 0 L0 6 L-5.5 0Z" fill="none" stroke="#ffc2cf" stroke-opacity="0.6"/><ellipse cx="-4" cy="-4.5" rx="2.4" ry="1.3" fill="#fff" transform="rotate(-40 -4 -4.5)"/></g>
    <g id="emerald"><path d="M-6.5-11.5 H6.5 L11.5-6.5 V6.5 L6.5 11.5 H-6.5 L-11.5 6.5 V-6.5Z" fill="#25d97a" stroke="#07693a" stroke-width="2"/><path d="M-3-5.5 H3 L5.5-3 V3 L3 5.5 H-3 L-5.5 3 V-3Z" fill="none" stroke="#bfffdc" stroke-opacity="0.6"/><ellipse cx="-4" cy="-4.5" rx="2.4" ry="1.3" fill="#fff" transform="rotate(-40 -4 -4.5)"/></g>
    <g id="sapphire"><circle r="12" fill="#3f8cff" stroke="#17318f" stroke-width="2"/><circle r="5.8" fill="none" stroke="#c6dcff" stroke-opacity="0.6"/><ellipse cx="-4" cy="-4.5" rx="2.4" ry="1.3" fill="#fff" transform="rotate(-40 -4 -4.5)"/></g>
    <g id="topaz"><path d="M0-12.4 L3.8-4.3 L12.6-3.1 L6.2 3 L7.8 11.8 L0 7.6 L-7.8 11.8 L-6.2 3 L-12.6-3.1 L-3.8-4.3Z" fill="#ffc533" stroke="#9a5d00" stroke-width="2" stroke-linejoin="round"/><ellipse cx="-3" cy="-3" rx="2" ry="1.1" fill="#fff" transform="rotate(-40 -3 -3)"/></g>
    <g id="amethyst"><path d="M0-12 L12.6 10.4 L-12.6 10.4Z" fill="#b95cff" stroke="#521a96" stroke-width="2" stroke-linejoin="round"/><path d="M0-4.5 L5.5 5 L-5.5 5Z" fill="none" stroke="#ecd2ff" stroke-opacity="0.6"/><ellipse cx="-2.5" cy="0" rx="2" ry="1.1" fill="#fff" transform="rotate(-40 -2.5 0)"/></g>
  </defs>
  <rect width="320" height="180" fill="url(#bg)"/>
  <!-- 보드 -->
  <rect x="20" y="10" width="168" height="162" rx="6" fill="url(#board)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2"/>
  <g stroke="#c4b5fd" stroke-opacity="0.08">
    <path d="M48 10V172M76 10V172M104 10V172M132 10V172M160 10V172"/>
  </g>
  <!-- 쌓인 크리스털 (칸 28px) -->
  <use href="#sapphire" x="34" y="158"/><use href="#sapphire" x="62" y="158"/><use href="#ruby" x="90" y="158"/><use href="#emerald" x="118" y="158"/><use href="#emerald" x="146" y="158"/><use href="#amethyst" x="174" y="158"/>
  <use href="#ruby" x="34" y="130"/><use href="#sapphire" x="62" y="130"/><use href="#ruby" x="90" y="130"/><use href="#ruby" x="118" y="130"/><use href="#emerald" x="146" y="130"/><use href="#amethyst" x="174" y="130"/>
  <use href="#ruby" x="34" y="102"/><use href="#amethyst" x="62" y="102"/><use href="#emerald" x="146" y="102"/><use href="#amethyst" x="174" y="102"/>
  <use href="#amethyst" x="34" y="74"/>
  <!-- 터지는 토파즈 그룹 -->
  <circle cx="104" cy="88" r="34" fill="url(#burst)"/>
  <g opacity="0.95"><use href="#topaz" x="90" y="102"/><use href="#topaz" x="118" y="102"/><use href="#topaz" x="90" y="74"/><use href="#topaz" x="118" y="74"/></g>
  <g fill="#fff3bd">
    <path d="M70 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M140 56l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M104 46l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
  </g>
  <path d="M84 70l-10-6M124 66l9-7M126 108l10 6M80 110l-9 5" stroke="#ffe27a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 떨어지는 쌍 -->
  <use href="#sapphire" x="62" y="22"/><use href="#ruby" x="62" y="46"/>
  <!-- 제목·연쇄 문구 -->
  <text x="254" y="50" text-anchor="middle" font-family="monospace" font-weight="700" font-size="21" fill="#f5d0fe">CASCADE</text>
  <text x="254" y="74" text-anchor="middle" font-family="monospace" font-weight="700" font-size="21" fill="#f5d0fe">RUSH</text>
  <text x="254" y="108" text-anchor="middle" font-family="monospace" font-weight="700" font-size="15" fill="#ffe27a" stroke="#1a0b3b" stroke-width="3" paint-order="stroke">4 CHAIN!</text>
  <text x="254" y="128" text-anchor="middle" font-family="monospace" font-size="11" fill="#e9d5ff">×8</text>
  <rect x="210" y="146" width="88" height="10" rx="5" fill="#2e1065" stroke="#c4b5fd" stroke-opacity="0.4"/>
  <rect x="212" y="148" width="62" height="6" rx="3" fill="#e879f9"/>
  <text x="254" y="142" text-anchor="middle" font-family="monospace" font-size="10" fill="#7dffb9">+3 SEC</text>
</svg>
