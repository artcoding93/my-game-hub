<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1338"/>
      <stop offset="0.6" stop-color="#1b1550"/>
      <stop offset="1" stop-color="#2a1a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fcd34d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ccfbf1"/><stop offset="0.4" stop-color="#5eead4"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="vio" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="0.4" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="0.4" stop-color="#fcd34d"/><stop offset="1" stop-color="#b45309"/></linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe4e6"/><stop offset="0.4" stop-color="#fb7185"/><stop offset="1" stop-color="#be123c"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="0.4" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="bump" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf4ff"/><stop offset="0.4" stop-color="#f0abfc"/><stop offset="1" stop-color="#a21caf"/></linearGradient>
    <symbol id="b" viewBox="0 0 28 28"><rect x="1.5" y="1.5" width="25" height="25" rx="5"/></symbol>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <!-- 눈송이 -->
  <g fill="#f1f5ff" opacity="0.8">
    <circle cx="40" cy="40" r="2"/><circle cx="120" cy="90" r="1.5"/><circle cx="80" cy="200" r="2.5"/><circle cx="30" cy="300" r="1.5"/>
    <circle cx="590" cy="60" r="2"/><circle cx="520" cy="140" r="1.5"/><circle cx="610" cy="250" r="2.5"/><circle cx="560" cy="320" r="1.5"/>
    <circle cx="170" cy="30" r="1.5"/><circle cx="470" cy="30" r="2"/><circle cx="150" cy="330" r="2"/><circle cx="490" cy="300" r="1.5"/>
  </g>
  <g stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M90 130v28M76 137l28 14M76 151l28-14"/>
    <path d="M555 190v28M541 197l28 14M541 211l28-14"/>
  </g>
  <!-- 게임판 -->
  <rect x="236" y="40" width="168" height="300" rx="10" fill="#0b1338" stroke="#a5b4fc" stroke-opacity="0.5" stroke-width="3"/>
  <g transform="translate(236 40)">
    <!-- 낙하 중인 T -->
    <use href="#b" x="70" y="28" width="28" height="28" fill="url(#vio)"/>
    <use href="#b" x="42" y="56" width="28" height="28" fill="url(#vio)"/>
    <use href="#b" x="70" y="56" width="28" height="28" fill="url(#vio)"/>
    <use href="#b" x="98" y="56" width="28" height="28" fill="url(#vio)"/>
    <!-- 쌓인 블록 -->
    <use href="#b" x="0" y="272" width="28" height="28" fill="url(#ice)"/><use href="#b" x="28" y="272" width="28" height="28" fill="url(#ice)"/>
    <use href="#b" x="56" y="272" width="28" height="28" fill="url(#gold)"/><use href="#b" x="84" y="272" width="28" height="28" fill="url(#gold)"/>
    <use href="#b" x="112" y="272" width="28" height="28" fill="url(#rose)"/><use href="#b" x="140" y="272" width="28" height="28" fill="url(#blue)"/>
    <use href="#b" x="0" y="244" width="28" height="28" fill="url(#ice)"/><use href="#b" x="56" y="244" width="28" height="28" fill="url(#gold)"/>
    <use href="#b" x="84" y="244" width="28" height="28" fill="url(#gold)"/><use href="#b" x="112" y="244" width="28" height="28" fill="url(#rose)"/>
    <use href="#b" x="140" y="244" width="28" height="28" fill="url(#blue)"/><use href="#b" x="140" y="216" width="28" height="28" fill="url(#blue)"/>
    <use href="#b" x="112" y="216" width="28" height="28" fill="url(#rose)"/>
    <!-- 혹 -->
    <use href="#b" x="84" y="216" width="28" height="28" fill="url(#bump)"/>
    <path d="M98 222l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff"/>
    <circle cx="98" cy="230" r="22" fill="none" stroke="#f5d0fe" stroke-width="2" opacity="0.7"/>
    <!-- 얼음 칸 -->
    <rect x="29.5" y="273.5" width="25" height="25" rx="5" fill="#bae6fd" fill-opacity="0.55" stroke="#e0f2fe" stroke-width="2"/>
    <path d="M34 280l9 6-3 10M43 286l9-3" stroke="#0c4a6e" stroke-width="1.5" fill="none"/>
  </g>
  <!-- 제목 -->
  <g font-family="Verdana, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="118" y="250" font-size="30" fill="#f8fafc">WINTER</text>
    <text x="118" y="286" font-size="30" fill="#bae6fd">BLOCKS</text>
    <text x="522" y="110" font-size="13" fill="#fde68a" letter-spacing="2">A COZY</text>
    <text x="522" y="128" font-size="13" fill="#fde68a" letter-spacing="2">PUZZLE</text>
    <text x="522" y="146" font-size="13" fill="#fde68a" letter-spacing="2">CHALLENGE</text>
  </g>
</svg>
