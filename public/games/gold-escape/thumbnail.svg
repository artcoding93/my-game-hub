<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" shape-rendering="crispEdges">
  <rect width="640" height="360" fill="#06070d"/>
  <!-- bricks -->
  <g fill="#c2410c" stroke="#2a1206" stroke-width="4">
    <rect x="0" y="220" width="80" height="40"/><rect x="80" y="220" width="80" height="40"/>
    <rect x="240" y="220" width="80" height="40"/><rect x="320" y="220" width="80" height="40"/>
    <rect x="400" y="220" width="80" height="40"/><rect x="480" y="220" width="80" height="40"/>
    <rect x="560" y="220" width="80" height="40"/>
    <rect x="0" y="100" width="80" height="40"/><rect x="80" y="100" width="80" height="40"/>
    <rect x="160" y="100" width="80" height="40"/><rect x="240" y="100" width="80" height="40"/>
  </g>
  <!-- hole with trapped guard -->
  <rect x="164" y="224" width="72" height="36" fill="#06070d"/>
  <g fill="#e11d48"><rect x="186" y="232" width="28" height="22"/></g>
  <rect x="190" y="214" width="20" height="18" fill="#fda4af"/>
  <!-- ladder -->
  <g fill="#e0b26b">
    <rect x="452" y="100" width="8" height="120"/><rect x="492" y="100" width="8" height="120"/>
    <rect x="452" y="116" width="48" height="8"/><rect x="452" y="148" width="48" height="8"/>
    <rect x="452" y="180" width="48" height="8"/><rect x="452" y="212" width="48" height="8"/>
  </g>
  <!-- rope -->
  <rect x="320" y="80" width="132" height="6" fill="#e5e7eb"/>
  <!-- player -->
  <rect x="270" y="170" width="20" height="18" fill="#ffd9a8"/>
  <rect x="262" y="188" width="36" height="22" fill="#22d3ee"/>
  <rect x="266" y="210" width="10" height="10" fill="#2563eb"/><rect x="284" y="210" width="10" height="10" fill="#2563eb"/>
  <!-- gold -->
  <g fill="#facc15"><rect x="560" y="196" width="48" height="20"/><rect x="40" y="76" width="48" height="20"/><rect x="380" y="196" width="48" height="20"/></g>
  <text x="320" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#facc15">GOLD ESCAPE</text>
</svg>
